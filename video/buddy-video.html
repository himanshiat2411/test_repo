<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Shuffle Buddy Film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
  html,body{margin:0;background:#14214D;height:100%;display:grid;place-items:center}
  canvas{width:min(100vw,177.78vh);height:auto;display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* City Shuffle: buddy concept film (about 76 s).
   Open this file to watch it live. The video renderer calls renderAt(seconds) frame by frame. */
const W = 1920, H = 1080, DURATION = 76;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F = '"Nunito", "Segoe UI", system-ui, sans-serif';

/* ---------- script: captions ---------- */
const CAPTIONS = [
  [0.8, 6, 'Every night from 2 to 4 AM, our city rearranges itself.'],
  [6, 11, "Let's zoom in."],
  [11, 17.5, '2:00 AM. Whole neighbourhoods swap places. Places inside a block stay together.'],
  [17.5, 21, 'Anchors never move: the hospitals, the river and the old clock tower.'],
  [21, 28, "4:00 AM. The city's AI learns the new map block by block, from street sensors."],
  [28, 35, 'Every person gets a floating buddy. It is linked to the city AI.'],
  [35, 47, 'Kamala, 75, needs her pharmacy. Her buddy guides her by landmarks.'],
  [47, 55, 'The buddy\'s shape shows how sure the AI is.'],
  [55, 62, 'One AI, with a buddy shaped for each person.'],
  [62, 72, 'Today it lives in your phone. Tomorrow you may build your own.'],
];

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const out = k => 1 - Math.pow(1 - k, 3);
const back = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fmt(m) { m = Math.round(m); const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0'); return `${h % 12 || 12}:${mm} ${h < 12 ? 'AM' : 'PM'}`; }
function text(s, x, y, size, color = '#2F3447', weight = 800, align = 'center') { ctx.font = `${weight} ${size}px ${F}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); }
function wrap(s, maxW, size, weight = 800) { ctx.font = `${weight} ${size}px ${F}`; const words = s.split(' '), lines = []; let l = ''; for (const w of words) { const tt = l ? l + ' ' + w : w; if (ctx.measureText(tt).width > maxW && l) { lines.push(l); l = w; } else l = tt; } lines.push(l); return lines; }

/* ---------- city model (4 x 4 slots) ---------- */
const XS = [-410, -210, 30, 230], YS = [-390, -190, 10, 210], S = 180;
const slotXY = ([c, r]) => ({ x: XS[c], y: YS[r] });
const centerOf = cr => ({ x: XS[cr[0]] + S / 2, y: YS[cr[1]] + S / 2 });
const ANCHORS = [
  { name: 'North Hospital', kind: 'hospital', at: [0, 0] },
  { name: 'Clock Tower', kind: 'clock', at: [2, 1] },
  { name: 'South Hospital', kind: 'hospital', at: [3, 3] },
];
// home = yesterday, next = after tonight's shuffle. think/sure = seconds into the sync wave (null = stays).
const BLOCKS = [
  { name: 'Rosewood', tint: '#F4B7A0', icons: ['house', 'house', 'tree'], home: [1, 0], next: [2, 2], think: .5, sure: 2.2 },
  { name: 'Market Square', tint: '#E0532F', icons: ['stall', 'stall', 'house'], home: [2, 0], next: [1, 0], think: .3, sure: 1.6 },
  { name: 'School Hill', tint: '#F3D27A', icons: ['school', 'tree'], home: [3, 0], next: [0, 1], think: 1.2, sure: 3.5 },
  { name: 'Banyan Lane', tint: '#7DB36A', icons: ['pharmacy', 'banyan'], home: [0, 1], next: [3, 0], think: .9, sure: 2.8 },
  { name: 'Lakeview', tint: '#9CCBDD', icons: ['water', 'house', 'tree'], home: [1, 1], next: [1, 2], think: 1, sure: 3 },
  { name: 'Temple Street', tint: '#F2A33A', icons: ['temple', 'tree'], home: [3, 1], next: [0, 2], think: 2, sure: 4.4 },
  { name: 'Green Commons', tint: '#A6CF8F', icons: ['tree', 'water', 'tree'], home: [0, 2], next: [2, 0], think: 1.4, sure: 3.2 },
  { name: 'Harbour Row', tint: '#D9C2EA', icons: ['hotel', 'house'], home: [2, 2], next: [0, 3], think: .4, sure: 1.9 },
  { name: 'Sunrise Heights', tint: '#BFD6E8', icons: ['tower', 'tree'], home: [3, 2], next: [3, 1], think: null, sure: null },
  { name: 'Canal Side', tint: '#7FB8CC', icons: ['water', 'house'], home: [0, 3], next: [1, 3], think: 1.1, sure: 2.6 },
  { name: 'Old Town', tint: '#C98B5A', icons: ['house', 'house', 'house'], home: [1, 3], next: [2, 3], think: 2.4, sure: null },
  { name: 'Festival Ground', tint: '#F2C25B', icons: ['tent', 'stall'], home: [2, 3], next: [1, 1], think: 2.8, sure: 5 },
];

/* ---------- camera ---------- */
function camera(t) {
  const k = ease(seg(t, 6, 11));
  return { z: lerp(.5, .97, k), tilt: lerp(.48, 1, k), cx: 960, cy: lerp(560, 478, k) };
}
let CAM;
const toScreen = (x, y) => ({ x: CAM.cx + x * CAM.z, y: CAM.cy + y * CAM.z * CAM.tilt });

/* ---------- small hand-drawn icons (world units) ---------- */
function ink() { ctx.strokeStyle = '#2F3447'; ctx.lineWidth = 3; ctx.lineJoin = ctx.lineCap = 'round'; }
function drawIcon(kind, x, y, tint) {
  ink(); ctx.save(); ctx.translate(x, y);
  const fs = (c) => { ctx.fillStyle = c; ctx.fill(); ctx.stroke(); };
  switch (kind) {
    case 'house': rr(-20, -6, 40, 30, 3); fs(tint); ctx.beginPath(); ctx.moveTo(-26, -4); ctx.lineTo(0, -26); ctx.lineTo(26, -4); ctx.closePath(); fs('#D46C4E'); rr(-5, 8, 10, 16, 2); fs('#fff'); break;
    case 'tree': ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, 26); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -4, 18, 0, 7); fs('#8CC07A'); break;
    case 'banyan': ctx.beginPath(); ctx.moveTo(-10, 24); ctx.lineTo(-8, 4); ctx.moveTo(0, 24); ctx.lineTo(0, 0); ctx.moveTo(10, 24); ctx.lineTo(8, 4); ctx.stroke(); ctx.beginPath(); ctx.ellipse(0, -6, 28, 15, 0, 0, 7); fs('#7DB36A'); break;
    case 'water': ctx.beginPath(); ctx.ellipse(0, 6, 26, 15, 0, 0, 7); fs('#9CCBDD'); ctx.beginPath(); ctx.moveTo(-12, 6); ctx.quadraticCurveTo(-6, 0, 0, 6); ctx.quadraticCurveTo(6, 12, 12, 6); ctx.stroke(); break;
    case 'stall': rr(-18, -2, 36, 26, 2); fs('#FBEBD0'); ctx.beginPath(); ctx.moveTo(-24, -2); ctx.lineTo(-18, -20); ctx.lineTo(18, -20); ctx.lineTo(24, -2); ctx.closePath(); fs('#E0532F'); break;
    case 'school': rr(-22, -4, 44, 28, 2); fs('#F3D27A'); ctx.beginPath(); ctx.moveTo(-28, -2); ctx.lineTo(0, -24); ctx.lineTo(28, -2); ctx.closePath(); fs('#D46C4E'); ctx.beginPath(); ctx.arc(0, 6, 5, 0, 7); fs('#fff'); break;
    case 'pharmacy': rr(-22, -20, 44, 44, 6); fs('#fff'); ctx.strokeStyle = '#2E9E6B'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 14); ctx.moveTo(-12, 2); ctx.lineTo(12, 2); ctx.stroke(); break;
    case 'temple': rr(-24, 2, 48, 22, 2); fs('#F6CFA8'); rr(-14, -10, 28, 12, 2); fs('#F6CFA8'); ctx.beginPath(); ctx.moveTo(-10, -10); ctx.quadraticCurveTo(0, -36, 10, -10); ctx.closePath(); fs('#F2A33A'); break;
    case 'hotel': rr(-18, -22, 36, 46, 2); fs('#D9C2EA'); ctx.font = `900 22px ${F}`; ctx.fillStyle = '#2F3447'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('H', 0, 2); break;
    case 'tower': rr(-16, -26, 32, 50, 2); fs('#BFD6E8'); ctx.beginPath(); for (let i = 0; i < 3; i++) { ctx.moveTo(-8, -16 + i * 13); ctx.lineTo(-3, -16 + i * 13); ctx.moveTo(4, -16 + i * 13); ctx.lineTo(9, -16 + i * 13); } ctx.stroke(); break;
    case 'tent': ctx.beginPath(); ctx.moveTo(-26, 24); ctx.lineTo(0, -22); ctx.lineTo(26, 24); ctx.closePath(); fs('#F2C25B'); ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -34); ctx.lineTo(12, -30); ctx.lineTo(0, -26); ctx.stroke(); break;
  }
  ctx.restore();
}
function pin(x, y, s = 1) {
  ink(); ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 2, -16, -16, 0, -18); ctx.bezierCurveTo(16, -16, 18, 2, 0, 22); ctx.fillStyle = '#E0532F'; ctx.fill(); ctx.stroke();
  rr(-6, -6, 12, 9, 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, -7, 4, Math.PI, 0); ctx.stroke();
  ctx.restore();
}

/* ---------- city drawing ---------- */
function levelOf(b, t) {
  if (t < 11) return 'sure';
  if (t < 21.3) return 'unknown';
  const s = t - 21.3;
  if (b.think == null || s < b.think) return 'unknown';
  if (b.sure == null || s < b.sure) return 'think';
  return 'sure';
}
function drawBlock(b, x, y, lvl, lift, hl) {
  ctx.save();
  if (lift > 0) { ctx.translate(x + S / 2, y + S / 2); ctx.scale(1 + lift * .1, 1 + lift * .1); ctx.translate(-x - S / 2, -y - S / 2);
    ctx.fillStyle = 'rgba(20,24,40,.25)'; rr(x + 10 * lift, y + 18 * lift, S, S, 22); ctx.fill(); }
  ink(); ctx.lineWidth = 3;
  rr(x, y, S, S, 22);
  ctx.fillStyle = lvl === 'unknown' ? '#DFE0E6' : '#FFFDF8'; ctx.fill();
  if (lvl === 'think') { ctx.save(); rr(x, y, S, S, 22); ctx.clip(); ctx.strokeStyle = 'rgba(242,194,91,.75)'; ctx.lineWidth = 9; ctx.beginPath(); for (let i = -S; i < S * 2; i += 20) { ctx.moveTo(x + i, y + S); ctx.lineTo(x + i + S, y); } ctx.stroke(); ctx.restore(); }
  // name
  ctx.globalAlpha = lvl === 'unknown' ? .45 : 1;
  ctx.beginPath(); ctx.arc(x + 20, y + 24, 7, 0, 7); ctx.fillStyle = b.tint; ctx.fill(); ink(); ctx.lineWidth = 2; ctx.stroke();
  ctx.font = `900 19px ${F}`; ctx.fillStyle = '#2F3447'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(b.name.length > 14 ? b.name.slice(0, 13) + '…' : b.name, x + 33, y + 25);
  // icons
  const n = b.icons.length; b.icons.forEach((ic, i) => drawIcon(ic, x + S * (i + 1) / (n + 1), y + 82 + (i % 2) * 18, b.tint));
  ctx.globalAlpha = 1;
  if (lvl === 'unknown') { // fog
    ctx.save(); rr(x, y, S, S, 22); ctx.clip();
    [[.3, .4, 60], [.7, .55, 70], [.45, .75, 55]].forEach(([fx, fy, r]) => { const g = ctx.createRadialGradient(x + S * fx, y + S * fy, 0, x + S * fx, y + S * fy, r); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, S, S); });
    ctx.restore();
  }
  // outline by level
  rr(x, y, S, S, 22); ctx.lineWidth = lvl === 'unknown' ? 4 : 3;
  ctx.strokeStyle = lvl === 'think' ? '#9C6F12' : lvl === 'unknown' ? '#7C8091' : '#2F3447';
  ctx.setLineDash(lvl === 'unknown' ? [2, 9] : []); ctx.stroke(); ctx.setLineDash([]);
  if (hl) { rr(x - 8, y - 8, S + 16, S + 16, 28); ctx.strokeStyle = '#E0532F'; ctx.lineWidth = 6; ctx.stroke(); }
  // label chip
  const L = { sure: "✓ I'm sure", think: '? I think so', unknown: "… I don't know yet" }[lvl];
  ctx.font = `900 15px ${F}`; const tw = ctx.measureText(L).width + 20;
  rr(x + 12, y + S - 36, tw, 26, 13);
  ctx.fillStyle = lvl === 'sure' ? '#2F3447' : lvl === 'think' ? '#F2C25B' : '#fff'; ctx.fill();
  if (lvl !== 'sure') { ctx.strokeStyle = lvl === 'think' ? '#9C6F12' : '#7C8091'; ctx.lineWidth = 2; ctx.setLineDash(lvl === 'unknown' ? [2, 4] : []); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle = lvl === 'sure' ? '#fff' : '#2F3447'; ctx.textAlign = 'left'; ctx.fillText(L, x + 22, y + S - 22);
  if (lvl === 'think') { ctx.beginPath(); ctx.arc(x + S - 6, y + 6, 15, 0, 7); ctx.fillStyle = '#F2C25B'; ctx.fill(); ink(); ctx.lineWidth = 2.5; ctx.stroke(); ctx.font = `900 19px ${F}`; ctx.fillStyle = '#2F3447'; ctx.textAlign = 'center'; ctx.fillText('?', x + S - 6, y + 7); }
  ctx.restore();
}
function drawAnchor(a, pulse) {
  const { x, y } = slotXY(a.at); ink();
  if (pulse > 0) { rr(x - 10, y - 10, S + 20, S + 20, 30); ctx.strokeStyle = `rgba(224,83,47,${pulse})`; ctx.lineWidth = 10; ctx.stroke(); ink(); }
  rr(x, y, S, S, 22); ctx.fillStyle = '#F1E7D3'; ctx.fill(); ctx.lineWidth = 3.5; ctx.stroke();
  ctx.save(); ctx.translate(x + S / 2, y + 74);
  if (a.kind === 'hospital') { ctx.scale(1.4, 1.4); rr(-26, -22, 52, 44, 3); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); ctx.strokeStyle = '#E0532F'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke(); }
  else { ctx.scale(1.3, 1.3); rr(-14, -20, 28, 48, 2); ctx.fillStyle = '#E8D3A8'; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-18, -20); ctx.lineTo(0, -40); ctx.lineTo(18, -20); ctx.closePath(); ctx.fillStyle = '#C6553A'; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -4, 9, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, -4); ctx.lineTo(4, -1); ctx.stroke(); }
  ctx.restore();
  text(a.name, x + S / 2, y + 140, 19, '#2F3447', 900);
  text('Never moves', x + S / 2, y + 162, 14, '#E0532F', 900);
  pin(x + S - 10, y + 6, 1.1);
}
function drawRiver() {
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, -560);
  for (let y = -560; y <= 560; y += 40) ctx.lineTo(Math.sin(y / 70) * 9, y);
  ctx.strokeStyle = '#9CCBDD'; ctx.lineWidth = 50; ctx.stroke();
  ctx.strokeStyle = '#C3E2EE'; ctx.lineWidth = 14; ctx.setLineDash([24, 30]); ctx.stroke(); ctx.setLineDash([]);
  [1, 3].forEach(r => { const y = YS[r] + S / 2; ink(); rr(-46, y - 18, 92, 36, 8); ctx.fillStyle = '#D9C7A3'; ctx.fill(); ctx.stroke(); ctx.lineWidth = 2; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(-38, y - 8); ctx.lineTo(38, y - 8); ctx.moveTo(-38, y + 8); ctx.lineTo(38, y + 8); ctx.stroke(); ctx.setLineDash([]); });
  ctx.restore();
}
function blockPos(b, i, t) {
  const a = slotXY(b.home), z = slotXY(b.next), st = 13 + i * .32, k = ease(seg(t, st, st + 2.1));
  const lift = Math.sin(Math.PI * seg(t, st, st + 2.1));
  return { x: lerp(a.x, z.x, k), y: lerp(a.y, z.y, k), lift, moving: k > 0 && k < 1 };
}
function drawCity(t, opts = {}) {
  CAM = camera(t);
  const { z, tilt, cx, cy } = CAM, R = 640;
  // island body
  const rx = R * z, ry = R * z * tilt, th = 90 * z * (1 - tilt) / .52;
  ctx.save();
  ctx.fillStyle = '#7D8AA3'; ctx.beginPath(); ctx.ellipse(cx, cy + th, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillRect(cx - rx, cy, rx * 2, th);
  ctx.fillStyle = '#95A2BB'; ctx.beginPath(); ctx.ellipse(cx, cy + th, rx, ry, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#B8D79A'; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2F3447'; ctx.lineWidth = 3; ctx.stroke();
  // world transform
  ctx.translate(cx, cy); ctx.scale(z, z * tilt);
  rr(-440, -420, 880, 860, 40); ctx.fillStyle = '#E7DCC5'; ctx.fill();
  drawRiver();
  const pulse = opts.pulse || 0;
  ANCHORS.forEach(a => drawAnchor(a, pulse));
  // empty lot
  const lotHome = [1, 2], lotNext = [3, 2], lk = ease(seg(t, 15, 17));
  const lp = { x: lerp(XS[lotHome[0]], XS[lotNext[0]], lk), y: lerp(YS[lotHome[1]], YS[lotNext[1]], lk) };
  ctx.globalAlpha = lk > 0 && lk < 1 ? .3 : 1; rr(lp.x, lp.y, S, S, 22); ctx.fillStyle = '#DCE9C4'; ctx.fill(); ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(47,52,71,.4)'; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
  text('Open ground', lp.x + S / 2, lp.y + S / 2, 17, '#56704A', 800); ctx.globalAlpha = 1;
  // blocks: still ones first, moving ones on top
  const list = BLOCKS.map((b, i) => ({ b, i, p: blockPos(b, i, t) })).sort((a, b) => (a.p.moving - b.p.moving) || (a.p.lift - b.p.lift));
  list.forEach(({ b, p }) => drawBlock(b, p.x, p.y, opts.levelFn ? opts.levelFn(b, t) : levelOf(b, t), p.lift, opts.hl === b.name));
  if (opts.world) opts.world();
  ctx.restore();
}

/* ---------- buddies ---------- */
function lantern(x, y, s, state, t) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 2.4) * 6 * s);
  let rot = 0, sc = s, alpha = 1;
  if (state === 'think') rot = Math.sin(t * 7) * .14;
  if (state === 'unknown') { sc = s * .82; alpha = .9; }
  if (state === 'sorry') rot = -.22;
  ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = alpha;
  // glow
  const glow = { sure: .55, think: .35, unknown: .1, sorry: .2 }[state];
  const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 90); g.addColorStop(0, `rgba(255,196,90,${glow})`); g.addColorStop(1, 'rgba(255,196,90,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 90, 0, 7); ctx.fill();
  ink(); ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(0, -40); ctx.stroke();
  rr(-18, -42, 36, 10, 4); ctx.fillStyle = '#2F3447'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 36, 34, 0, 0, 7);
  ctx.fillStyle = state === 'unknown' ? '#DFE0E6' : state === 'sorry' ? '#E9C58A' : '#FFC46A'; ctx.fill();
  if (state === 'think') { ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(224,150,40,.55)'; ctx.lineWidth = 7; ctx.beginPath(); for (let i = -80; i < 80; i += 16) { ctx.moveTo(i, 40); ctx.lineTo(i + 80, -40); } ctx.stroke(); ctx.restore(); }
  ctx.beginPath(); ctx.ellipse(0, 0, 36, 34, 0, 0, 7); ctx.setLineDash(state === 'unknown' ? [3, 7] : []); ctx.stroke(); ctx.setLineDash([]);
  ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 18, 34, 0, 0, 7); ctx.globalAlpha = alpha * .35; ctx.stroke(); ctx.globalAlpha = alpha; ctx.lineWidth = 3.5;
  rr(-14, 32, 28, 9, 4); ctx.fillStyle = '#2F3447'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 41); ctx.lineTo(0, 56); ctx.strokeStyle = '#E0532F'; ctx.lineWidth = 4; ctx.stroke(); ink();
  // face
  ctx.fillStyle = '#2F3447';
  if (state === 'sorry') { ctx.beginPath(); ctx.arc(-11, -3, 5, 0, Math.PI); ctx.moveTo(16, -3); ctx.arc(11, -3, 5, 0, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 16, 6, Math.PI, 0); ctx.stroke(); }
  else {
    const blink = (t % 3.3) < .12 ? .2 : 1;
    ctx.beginPath(); ctx.ellipse(-11, -4, 4, 5 * blink, 0, 0, 7); ctx.ellipse(11, -4, 4, 5 * blink, 0, 0, 7); ctx.fill();
    ctx.beginPath();
    if (state === 'unknown') { ctx.moveTo(-8, 12); ctx.quadraticCurveTo(-4, 8, 0, 12); ctx.quadraticCurveTo(4, 16, 8, 12); }
    else ctx.arc(0, 7, 8, .2, Math.PI - .2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(224,83,47,.35)'; ctx.beginPath(); ctx.arc(-22, 6, 5, 0, 7); ctx.arc(22, 6, 5, 0, 7); ctx.fill();
  }
  if (state === 'think') { ctx.font = `900 34px ${F}`; ctx.fillStyle = '#9C6F12'; ctx.textAlign = 'center'; ctx.fillText('?', 0, -66 + Math.sin(t * 5) * 3); }
  if (state === 'unknown') { ctx.globalAlpha = .7; [[-34, 14, 16], [30, 20, 18], [0, 34, 15]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }); }
  ctx.restore();
}
function bird(x, y, s, t) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 3) * 6 * s); ctx.scale(s, s); ink(); ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(30, -4); ctx.lineTo(52, 2); ctx.lineTo(30, 10); ctx.closePath(); ctx.fillStyle = '#F2A33A'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fillStyle = '#5FA8D3'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(4, 14, 22, 16, 0, 0, 7); ctx.fillStyle = '#DDEFF8'; ctx.fill();

    ctx.save(); ctx.globalAlpha = a * k2; glasses(960, 520, 1.25, t); text('Soon', 960, 800, 44, '#E0532F', 900); text('It floats in your real street (AR)', 960, 850, 28, '#5E6274', 800); ctx.restore();
    arrowRight(1250, 520, a * out(seg(t, 66.3, 66.8)));
    ctx.save(); ctx.globalAlpha = a * out(seg(t, 66.3, 67)); buildOrb(1540, 500, 1.25, k3, t); text('Future', 1540, 800, 44, '#E0532F', 900); text('You build your own physical buddy', 1540, 850, 28, '#5E6274', 800); ctx.restore();
    ctx.restore();
  }
  // J: end title
  if (t >= 72) {
    const a = seg(t, 72, 72.8);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#14214D'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; for (let i = 0; i < 60; i++) { ctx.beginPath(); ctx.arc((i * 397) % W, (i * 211) % H, (i % 3) + 1, 0, 7); ctx.fill(); }
    lantern(W / 2, 360, 2.6 * back(seg(t, 72.3, 73.3)), 'sure', t);
    text('City Shuffle', W / 2, 600, 110, '#fff', 900);
    text('A buddy that knows when it is sure, and says so when it is not.', W / 2, 700, 38, '#F2C25B', 800);
    text('Cvent BeyondPixels', W / 2, 800, 28, 'rgba(255,255,255,.7)', 800);
    ctx.restore();
  }
  // A: title
  if (t < 6) {
    const a = seg(t, .2, 1) * (1 - seg(t, 5, 6));
    ctx.save(); ctx.globalAlpha = a;
    text('City Shuffle', W / 2, 120, 110, '#2F3447', 900);
    text('A city that moves every night, and a buddy that moves with you', W / 2, 205, 36, '#2F3447', 800);
    ctx.restore();
  }
  caption(t);
}

/* live preview when opened directly */
window.renderAt = renderAt; window.DURATION = DURATION;
if (!location.search.includes('render')) {
  let t0 = null;
  const loop = now => { if (t0 == null) t0 = now; const t = ((now - t0) / 1000) % (DURATION + 1); renderAt(t); requestAnimationFrame(loop); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(loop));
} else renderAt(0);
</script>
