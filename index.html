<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Shuffle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive paper city that rearranges itself every night, and an AI that says when it is sure, guessing, or wrong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: the paper city map is the hero (left), the AI message panel is second (right),
   quiet grouped controls sit in one row above. Single deliberate look: paper by day, deep blue by night. */
:root{
  --paper:#FBF6EC; --paper-2:#F1E7D3; --street:#E7DCC5; --ink:#2F3447; --ink-soft:#5E6274;
  --accent:#E0532F; --accent-soft:rgba(224,83,47,.12);
  --sure:#FFFDF8; --think:#F2C25B; --think-ink:#5C3F05; --fog:#DFE0E6; --fog-line:#7C8091;
  --water:#9CCBDD; --water-ink:#2C5E73; --grass:#DCE9C4;
  --night:#14214D; --night-ink:#E9ECF8;
  --page:var(--paper); --page-ink:var(--ink); --group:rgba(47,52,71,.06);
  --font:"Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, "Noto Sans Devanagari", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-ink);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:12px 20px;
  transition:background-color 1s ease,color 1s ease}
body.night{--page:var(--night);--page-ink:var(--night-ink);--group:rgba(255,255,255,.09)}
body.story-on{padding-bottom:140px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}

.app{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,410px);
  grid-template-areas:"top top" "ctrl ctrl" "stage panel";gap:12px 22px}

/* ---- header ---- */
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.01em;line-height:1.05}
.brand p{margin:0;font-size:16px;opacity:.78}
.residents{display:flex;gap:8px;flex-wrap:wrap}
.res{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer;font-weight:800;font-size:16px;min-height:44px}
.res small{font-weight:600;color:var(--ink-soft);font-size:16px}
.res[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.res[aria-pressed="true"] small{color:#D4D6E0}
.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none;border:2px solid var(--ink)}
.clock{display:flex;align-items:center;gap:10px}
.clock svg{width:34px;height:34px}
.clock .t{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.clock .ph{font-size:16px;opacity:.8}

/* ---- controls ---- */
.controls{grid-area:ctrl;display:flex;flex-wrap:wrap;gap:8px 8px;align-items:center}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px;border-radius:999px;background:var(--group)}
.group .gl{font-size:16px;font-weight:700;opacity:.75;padding:0 6px 0 8px}
.btn{font-size:16px;font-weight:800;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;
  padding:6px 12px;cursor:pointer;min-height:40px;line-height:1.1}
.btn:hover{background:#fff}
.btn.primary{background:var(--accent);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#C9431F}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.slider{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:16px;font-weight:700}
.slider input{width:120px;accent-color:var(--accent)}
.seed{font-size:16px;opacity:.75;padding:0 8px;font-variant-numeric:tabular-nums}

/* ---- stage / board ---- */
.stage{grid-area:stage;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.board-wrap{width:min(100%, max(300px, calc(100dvh - 205px)));max-width:100%}
.board{position:relative;width:100%;aspect-ratio:1;border:2.5px solid var(--ink);border-radius:26px;overflow:hidden;
  container-type:inline-size;background-color:var(--street);
  background-image:radial-gradient(rgba(47,52,71,.07) 1px, transparent 1.2px);background-size:14px 14px;
  box-shadow:0 4px 0 var(--ink), 0 20px 40px rgba(20,33,77,.18)}
.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.layer.under{z-index:0}.layer.over{z-index:5}
.sky{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.1s ease;
  background:radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 72% 12%,#fff 60%,transparent),
  radial-gradient(1px 1px at 40% 40%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 86% 58%,#fff 60%,transparent),
  radial-gradient(1px 1px at 22% 76%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 60% 86%,#fff 60%,transparent),
  linear-gradient(rgba(20,33,77,.62),rgba(14,24,60,.74))}
body.night .sky{opacity:1}
.sky.morning{opacity:1;background:radial-gradient(circle at 80% 0%, rgba(255,196,110,.55), rgba(255,170,90,.18) 55%, rgba(255,230,180,.05))}

.slot{position:absolute;border-radius:16px}
.block{z-index:1;background:var(--sure);border:2px solid var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:1cqw 1.1cqw;gap:.4cqw;box-shadow:0 3px 0 rgba(47,52,71,.4);transition:background-color .5s,border-color .5s,opacity .6s,filter .6s}
.block.moving{z-index:3;box-shadow:0 10px 0 rgba(47,52,71,.25),0 18px 30px rgba(0,0,0,.25)}
.bname{display:flex;align-items:center;gap:.5cqw;font-weight:900;font-size:max(10px,2.15cqw);line-height:1.1;min-width:0}
.bname i{width:1.4cqw;height:1.4cqw;border-radius:50%;background:var(--tint);border:1.5px solid var(--ink);flex:none}
.bname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.places{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:.2cqw;min-height:0;transition:opacity .5s,filter .5s}
.place{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;border-radius:10px;position:relative}
.place svg{width:5.6cqw;height:5.6cqw;flex:none}
.place span{font-size:max(8px,1.42cqw);font-weight:800;line-height:1.05;text-align:center;color:var(--ink-soft);max-width:100%;overflow-wrap:anywhere}
.place.hl{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.chip{justify-self:start;display:inline-flex;align-items:center;gap:.35em;font-size:max(9px,1.72cqw);font-weight:900;padding:.1em .6em;
  border-radius:999px;background:var(--ink);color:#fff;white-space:nowrap;max-width:100%;overflow:hidden}
.qmark{display:none;position:absolute;top:-1.3cqw;right:-1.3cqw;width:3.8cqw;height:3.8cqw;border-radius:50%;background:var(--think);
  border:2px solid var(--ink);font-weight:900;font-size:max(10px,2.4cqw);place-items:center;color:var(--ink)}
.fog{display:none;position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 25% 35%, rgba(255,255,255,.85), transparent 45%),radial-gradient(circle at 75% 60%, rgba(255,255,255,.8), transparent 50%),rgba(223,224,230,.55);
  animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0 0, 0 0, 0 0}to{background-position:12px -6px,-14px 6px,0 0}}
.lvl-think{border-color:#9C6F12;background:repeating-linear-gradient(135deg, rgba(242,194,91,.6) 0 7px, var(--sure) 7px 14px)}
.lvl-think .chip{background:var(--think);color:var(--think-ink);border:1.5px solid #9C6F12}
.lvl-think .qmark{display:grid}
.lvl-unknown{background:var(--fog);border:3px dotted var(--fog-line);box-shadow:none}
.lvl-unknown .places{opacity:.28;filter:blur(1.3px)}
.lvl-unknown .fog{display:block}
.lvl-unknown .chip{background:#fff;color:var(--ink);border:2px dotted var(--fog-line);position:relative;z-index:1}
body.night .chip{opacity:0}
.board.offline .block{filter:grayscale(.85);opacity:.62}
.board.offline .chip::after{content:" · last known";font-weight:700}
.block.blink{animation:blink 1.3s ease-in-out 1}
@keyframes blink{0%,100%{box-shadow:0 3px 0 rgba(47,52,71,.4)}45%{box-shadow:0 0 0 7px var(--accent),0 0 22px 6px rgba(224,83,47,.6);transform:scale(1.04)}}

.anchor{z-index:1;background:var(--paper-2);border:2.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;
  box-shadow:0 3px 0 rgba(47,52,71,.4)}
.anchor > svg{width:8.5cqw;height:8.5cqw}
.anchor .aname{font-weight:900;font-size:max(10px,2cqw);text-align:center;line-height:1.1}
.anchor .never{font-size:max(8px,1.5cqw);font-weight:800;color:var(--accent);display:flex;align-items:center;gap:.3em}
.pin{position:absolute;top:-1cqw;right:-1cqw;width:4.4cqw;height:4.4cqw}
.anchor.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--accent),0 3px 0 rgba(47,52,71,.4)}}
.lot{z-index:0;border:2px dashed rgba(47,52,71,.35);background:var(--grass);display:grid;place-items:center;text-align:center;
  font-size:max(9px,1.6cqw);font-weight:800;color:#56704A}

.banner{position:absolute;left:50%;top:2.2%;transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;border-radius:999px;
  padding:8px 18px;font-weight:800;font-size:max(12px,2cqw);white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--accent)}
.banner .cd{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.2);padding:0 .5em;border-radius:999px}

.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:16px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:34px;height:22px;border-radius:7px;border:2px solid var(--ink);display:inline-grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink)}
.sw.sure{background:var(--sure)}
.sw.think{background:repeating-linear-gradient(135deg, rgba(242,194,91,.9) 0 5px, var(--sure) 5px 10px);border-color:#9C6F12}
.sw.unknown{background:var(--fog);border:2.5px dotted var(--fog-line)}
.sw.anchor{background:var(--paper-2)}

/* ---- panel ---- */
.panel{grid-area:panel;display:flex;flex-direction:column;gap:12px;min-width:0;max-height:calc(100dvh - 150px)}
.card{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink)}
.msg{padding:16px 18px;overflow:auto;min-height:0;flex:1 1 auto}
.who{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px dashed rgba(47,52,71,.2);margin-bottom:12px}
.who .ava{width:46px;height:46px;font-size:20px}
.who-n{font-weight:900;font-size:20px;line-height:1.1}
.who-t{font-size:16px;color:var(--ink-soft)}
.who .spacer{flex:1}
.ai{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;color:var(--accent);margin-bottom:6px}
.ai svg{width:20px;height:20px}
.msg p{margin:.3em 0}
.k{font-size:23px;line-height:1.45}
.k h2{font-size:27px;line-height:1.25;margin:.1em 0 .3em;font-weight:900;text-wrap:balance}
.k ol{padding-left:1.3em;margin:.4em 0}
.k li{margin:.35em 0}
.k li::marker{font-weight:900;color:var(--accent)}
.k .small{font-size:20px;color:var(--ink-soft)}
.read{display:inline-flex;align-items:center;gap:8px;font-size:20px;min-height:52px;padding:8px 20px;margin-top:8px}
.read svg{width:24px;height:24px}
.note{border-radius:16px;padding:10px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.note svg{width:34px;height:34px;flex:none}
.note.warn{background:var(--fog);border:2.5px dotted var(--fog-line)}
.note.avoid{background:var(--accent-soft);border:2px solid var(--accent)}
.note.ok{background:#E3F1DA;border:2px solid #5E8F4A}
.note.shock{background:#FFF0D6;border:2px solid #9C6F12}
.lang{display:flex;gap:4px}
.lang .btn{padding:4px 12px;min-height:36px}
.l-head{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;margin:4px 0 10px}
.l-head svg{width:38px;height:38px}
.l-head small{font-size:16px;font-weight:700;color:var(--ink-soft);display:block}
.pics{display:flex;flex-wrap:wrap;gap:10px 4px;align-items:flex-start}
.pic{width:86px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:16px;font-weight:800;line-height:1.15}
.pic svg{width:62px;height:62px;background:var(--paper-2);border:2px solid var(--ink);border-radius:18px;padding:6px}
.pic.end svg{background:var(--accent-soft);border-color:var(--accent)}
.pic.unk svg{background:var(--fog);border-style:dotted}
.sep{width:16px;align-self:center;margin-top:-22px;color:var(--ink-soft);font-weight:900;font-size:20px;text-align:center}
.arj{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bigarrow{width:128px;height:128px;border-radius:28px;background:var(--ink);display:grid;place-items:center}
.bigarrow svg{width:96px;height:96px}
.buzz{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;font-weight:800;color:var(--ink-soft)}
.buzz svg{width:150px;height:80px}
.buzz .vl,.buzz .vr{opacity:.15}
.buzz.left .vl,.buzz.right .vr{opacity:1;animation:buzz .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes buzz{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.steps{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.steps span{width:50px;height:50px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--paper-2)}
.steps span svg{width:34px;height:34px}
.orders{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.orders li{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.orders .n{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;border:2px solid var(--ink)}
.orders svg{width:38px;height:38px}
.orders .moved{font-size:16px;color:#9C6F12;font-weight:800}
.prev{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--ink-soft);text-decoration:line-through}
.wrongbox{border:2.5px solid var(--accent);border-radius:18px;padding:12px 14px;margin:0 0 12px;background:#FFF3EE}
.btn.big{font-size:21px;min-height:56px;padding:10px 22px;width:100%;margin:8px 0 4px}
.linkbtn{background:none;border:none;color:var(--ink);text-decoration:underline;font-weight:800;font-size:16px;cursor:pointer;padding:6px 0}
.sorry{border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;margin:0 0 12px;background:#fff}
.thanks{display:flex;gap:10px;align-items:center;font-weight:900;color:#3D6E2B}
.thanks svg{width:32px;height:32px;flex:none}
.tips{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:10px}
.tips li{display:flex;gap:10px;align-items:center}
.tips svg{width:40px;height:40px;flex:none}
.offline{border:2.5px dashed var(--ink);border-radius:18px;padding:12px 14px;margin:0 0 12px;background:#EEF0F6}
.offline h3{margin:0 0 4px;font-size:20px}

.log{padding:0}
.log summary{cursor:pointer;padding:12px 18px;font-weight:900;font-size:18px;list-style-position:inside}
.log ol{list-style:none;margin:0;padding:0 18px 14px;max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:4.6em 1fr;gap:6px;font-size:16px;line-height:1.35}
.log time{font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}
.log .empty{color:var(--ink-soft);display:block}

/* ---- story ---- */
.storybar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,24,42,.94);color:#fff;display:flex;gap:10px 18px;
  align-items:center;justify-content:center;flex-wrap:wrap;
  padding:12px max(16px, env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.storybar p{margin:0;font-size:21px;font-weight:800;max-width:62ch;text-align:center;text-wrap:balance}
.storybar .sc{display:flex;gap:6px;align-items:center}
.storybar .btn{background:transparent;color:#fff;border-color:#fff}
.storybar .btn.primary{background:var(--accent)}
.storybar .count{font-variant-numeric:tabular-nums;opacity:.8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "ctrl" "stage" "panel"}
  .panel{max-height:none}
  .board-wrap{width:100%}
  .brand h1{font-size:24px}
  .slider input{width:120px}
}
@media (max-width:480px){ .place span{display:none} .place svg{width:7cqw;height:7cqw} .clock .t{font-size:24px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-clock"/></svg>
      <div><h1>City Shuffle</h1><p>Every night from 2 to 4 AM, the city rearranges itself.</p></div>
    </div>
    <div class="residents" id="residents" role="group" aria-label="Pick a resident"></div>
    <div class="clock" aria-live="off">
      <svg viewBox="0 0 48 48" aria-hidden="true"><use id="clockIcon" href="#i-sun"/></svg>
      <div><div class="t" id="clockTime">1:59 AM</div><div class="ph" id="clockPhase">Before the shuffle</div></div>
    </div>
  </header>

  <nav class="controls" aria-label="Demo controls">
    <div class="group">
      <button class="btn primary" id="btnNight" type="button">Start the night</button>
      <button class="btn" id="btnReset" type="button">Reset</button>
      <button class="btn" id="btnSeed" type="button">New seed</button>
      <span class="seed" id="seedLabel"></span>
      <button class="btn" id="btnStory" type="button">▶ Play story</button>
    </div>
    <div class="group">
      <label class="slider" for="timeSlider">Morning <input type="range" id="timeSlider" min="240" max="420" step="1" value="240" disabled> <span id="sliderLabel">4:00 AM</span></label>
    </div>
    <div class="group" role="group" aria-label="What if">
      <button class="btn" id="btnWrong" type="button" aria-pressed="false">AI map out of date</button>
      <button class="btn" id="btnOffline" type="button" aria-pressed="false">Network down</button>
      <button class="btn" id="btnShock" type="button">Aftershock at 11 AM</button>
    </div>
  </nav>

  <section class="stage" aria-label="City map">
    <div class="board-wrap">
      <div class="board" id="board">
        <svg class="layer under" id="under" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
        <svg class="layer over" id="over" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="sky" id="sky"></div>
        <div class="banner" id="banner" hidden></div>
      </div>
    </div>
    <div class="legend" aria-label="How sure the AI is">
      <span><i class="sw sure">✓</i>I'm sure</span>
      <span><i class="sw think">?</i>I think so</span>
      <span><i class="sw unknown">…</i>I don't know yet</span>
      <span><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-pin"/></svg>Anchor: never moves</span>
    </div>
  </section>

  <aside class="panel" aria-label="City AI">
    <div class="card msg" id="msg" aria-live="polite"></div>
    <details class="card log" id="log" open>
      <summary>Why the AI did this</summary>
      <ol id="logList"></ol>
    </details>
  </aside>
</div>

<div class="storybar" id="storybar" hidden>
  <p id="caption"></p>
  <div class="sc">
    <button class="btn" id="stBack" type="button">◀ Back</button>
    <button class="btn primary" id="stPlay" type="button">Pause</button>
    <button class="btn" id="stNext" type="button">Next ▶</button>
    <span class="count" id="stCount"></span>
    <button class="btn" id="stClose" type="button">Close</button>
  </div>
</div>

   Helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (o[k] ?? ''));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const icon = (id, cls = '') => `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const wait = ms => new Promise(r => setTimeout(r, ms));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(m) { m = Math.round(m); const h = Math.floor(m / 60) % 24, mm = String(m % 60).padStart(2, '0'); return `${h % 12 || 12}:${mm} ${h < 12 ? 'AM' : 'PM'}`; }
const listNames = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

const C = CONFIG.grid.cols, R = CONFIG.grid.rows, N = C * R;
const sIdx = ([c, r]) => r * C + c, sCol = s => s % C, sRow = s => Math.floor(s / C);
const GEO = { x: [20, 250.5, 535, 765.5], y: [20, 264, 508, 752], w: 214.5, h: 228 };
const center = s => ({ x: GEO.x[sCol(s)] + GEO.w / 2, y: GEO.y[sRow(s)] + GEO.h / 2 });
const BLOCKS = CONFIG.blocks, BY = {}; BLOCKS.forEach(b => BY[b.id] = b);
const PLACE = {}; BLOCKS.forEach(b => b.places.forEach(p => PLACE[p.id] = { ...p, block: b.id }));
const ANCHOR_AT = {}; CONFIG.anchors.forEach(a => ANCHOR_AT[sIdx(a.slot)] = a);
const MOVABLE = [...Array(N).keys()].filter(s => !ANCHOR_AT[s]);
const homeLayout = () => Object.fromEntries(BLOCKS.map(b => [b.id, sIdx(b.home)]));

/* =====================================================================
   Routing (Dijkstra over the 4x4 slots; river crossable only at bridges)
   ===================================================================== */
function occupancy(pos) {
  const occ = Array.from({ length: N }, () => ({ type: 'lot' }));
  for (const s in ANCHOR_AT) occ[s] = { type: 'anchor', id: ANCHOR_AT[s].id, a: ANCHOR_AT[s] };
  for (const id in pos) occ[pos[id]] = { type: 'block', id };
  return occ;
}
const crossesRiver = (a, b) => Math.min(a, b) === CONFIG.river.afterCol && Math.max(a, b) === CONFIG.river.afterCol + 1;
function neighbors(s) {
  const c = sCol(s), r = sRow(s), out = [];
  for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nc = c + dc, nr = r + dr;
    if (nc < 0 || nr < 0 || nc >= C || nr >= R) continue;
    if (dc && crossesRiver(c, nc) && !CONFIG.river.bridgeRows.includes(r)) continue;
    out.push(nr * C + nc);
  }
  return out;
}
function findPath(from, to, pos, costFn) {
  const occ = occupancy(pos), dist = Array(N).fill(Infinity), prev = Array(N).fill(-1), done = Array(N).fill(false);
  dist[from] = 0;
  for (;;) {
    let u = -1;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < Infinity && (u < 0 || dist[i] < dist[u])) u = i;
    if (u < 0 || u === to) break;
    done[u] = true;
    for (const v of neighbors(u)) { const d = dist[u] + costFn(occ[v]); if (d < dist[v] - 1e-9) { dist[v] = d; prev[v] = u; } }
  }
  if (dist[to] === Infinity) return null;
  const path = []; for (let v = to; v !== -1; v = prev[v]) path.unshift(v);
  return { path, cost: dist[to] };
}
const uniformCost = () => 1;
const aiCost = o => o.type === 'block' ? { sure: 1, think: 2.5, unknown: 9 }[level(o.id)] : 1;
const slotOfPlace = (pid, pos) => pos[PLACE[pid].block];

function planArjun(pos, costFn) {
  const r = CONFIG.residents.arjun;
  let cur = slotOfPlace(r.start, pos), left = r.orders.slice();
  const order = [], legs = [];
  while (left.length) {
    let best = null;
    for (const o of left) { const res = findPath(cur, slotOfPlace(o, pos), pos, costFn); if (res && (!best || res.cost < best.res.cost)) best = { o, res }; }
    if (!best) break;
    order.push(best.o); legs.push(best.res.path); cur = best.res.path[best.res.path.length - 1];
    left = left.filter(x => x !== best.o);
  }
  return { order, legs };
}
function planFor(who, pos, costFn) {
  if (who === 'arjun') {
    const p = planArjun(pos, costFn), path = [];
    p.legs.forEach((l, i) => path.push(...(i ? l.slice(1) : l)));
    return { path, legs: p.legs, order: p.order };
  }
  const r = CONFIG.residents[who], res = findPath(slotOfPlace(r.from, pos), slotOfPlace(r.to, pos), pos, costFn);
  return { path: res ? res.path : [], legs: res ? [res.path] : [] };
}
function endpointBlocks(who) {
  const r = CONFIG.residents[who];
  const ids = who === 'arjun' ? [r.start, ...r.orders] : [r.from, r.to];
  return ids.map(p => PLACE[p].block);
}

/* =====================================================================
   Seeded shuffle: every block moves; anchors stay; one slot is left open.
   ===================================================================== */
function computeShuffle(seed) {
  const rng = mulberry32(seed);
  let pos = null;
  for (let tries = 0; tries < 800; tries++) {
    const arr = MOVABLE.slice();
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    pos = {}; BLOCKS.forEach((b, i) => pos[b.id] = arr[i]);
    if (BLOCKS.some(b => pos[b.id] === sIdx(b.home))) continue;
    const occ = occupancy(pos);
    const k = planFor('kamala', pos, uniformCost).path, l = planFor('lena', pos, uniformCost).path;
    if (k.length < 4 || l.length < 3) continue;
    if (!k.slice(1, -1).some(s => occ[s].type === 'block')) continue;
    return pos;
  }
  return pos;
}

/* =====================================================================
   State
   ===================================================================== */
let S = null;
function freshState(seed) {
  return {
    seed, phase: 'eve', time: CONFIG.time.before, synced: false, animating: false,
    belief: homeLayout(), real: homeLayout(), shuffled: computeShuffle(seed),
    overrides: {}, resident: S ? S.resident : 'kamala', lang: S ? S.lang : 'en',
    offline: false, wrong: null, shock: null, notice: null,
    log: [], logged: new Set(), blink: new Set(), walker: null,
    epoch: (S ? S.epoch : 0) + 1, speaking: false,
  };
}
function level(id) {
  if (S.phase === 'eve') return 'sure';
  if (S.phase === 'night') return 'unknown';
  if (S.overrides[id]) return S.overrides[id];
  const t = S.offline ? Math.min(S.time, CONFIG.time.lastKnown) : S.time, b = BY[id], m = t - CONFIG.time.nightEnd;
  if (m < b.thinkAt) return 'unknown';
  if (b.sureAt == null || m < b.sureAt) return 'think';
  return 'sure';
}
function addLog(text, key, t = S.time) {
  if (key) { if (S.logged.has(key)) return; S.logged.add(key); }
  S.log.push({ t, text });
}
function logSync(from, to) {
  const ev = [];
  for (const b of BLOCKS) {
    if (S.overrides[b.id]) continue;
    const tt = CONFIG.time.nightEnd + b.thinkAt, ts = b.sureAt == null ? null : CONFIG.time.nightEnd + b.sureAt;
    if (tt > from && tt <= to) ev.push({ t: tt, key: 'th' + b.id, text: fill(CONFIG.log[b.sureAt == null ? 'stuck' : 'think'], { block: b.name, k: b.early, n: b.sensors }) });
    if (ts != null && ts > from && ts <= to) ev.push({ t: ts, key: 'su' + b.id, text: fill(CONFIG.log.sure, { block: b.name, n: b.sensors }) });
  }
  ev.sort((a, b) => a.t - b.t).forEach(e => addLog(e.text, e.key, e.t));
}
function setTime(t) {
  t = Math.round(t);
  if (S.phase === 'day' && t > S.time) logSync(S.time, t);
  S.time = t;
  render();
}
function animateTime(from, to, ms) {
  const ep = S.epoch;
  if (RM || ms <= 0) { setTime(to); return Promise.resolve(); }
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      if (S.epoch !== ep) return res();
      const k = Math.min(1, (now - t0) / ms);
      setTime(from + (to - from) * k);
      if (k < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

function flipMove(change, { dur = 2500, stagger = 70, instant = false } = {}) {

  if (instant || RM) return Promise.resolve();

}
async function actAnchors({ instant } = {}) {
  if (instant || RM) return;
  const ep = S.epoch; S.pulse = true; render(); await wait(3200); if (S.epoch !== ep) return; S.pulse = false; render();
}
function ensureDay() {
  if (S.phase !== 'day' || !S.synced) { if (S.phase !== 'day') actNight({ instant: true }); setTime(Math.max(S.time, CONFIG.time.syncEnd)); S.synced = true; S.animating = false; document.body.classList.remove('night'); $('#sky').classList.remove('morning'); }
}
async function actKamala() { ensureDay(); S.resident = 'kamala'; setTime(Math.max(S.time, 420)); }

async function actWrong({ instant } = {}) {
  ensureDay();
  if (S.wrong) return;
  const who = S.resident, rt = currentRoute(), ends = endpointBlocks(who);
  const cands = rt.path.slice(1, -1).map(s => ({ s, o: rt.occ[s] })).filter(x => x.o.type === 'block' && !ends.includes(x.o.id) && level(x.o.id) !== 'unknown');
  if (!cands.length) { addLog(fill(CONFIG.log.noWrong, { who: CONFIG.residents[who].name })); render(); return; }
  const pick = cands.find(x => x.o.id === CONFIG.wrong.prefer) || cands[Math.floor((cands.length - 1) / 2)];
  const onRoute = new Set(rt.path.map(s => rt.occ[s]).filter(o => o.type === 'block').map(o => o.id));
  const others = BLOCKS.map(b => b.id).filter(id => id !== pick.o.id && !onRoute.has(id) && !ends.includes(id));
  const P = others[others.length - 1] || BLOCKS.map(b => b.id).find(id => id !== pick.o.id && !ends.includes(id));
  const W = pick.o.id, wS = S.real[W], pS = S.real[P];
  S.real[W] = pS; S.real[P] = wS;           // reality differs; the AI's belief stays the same
  S.overrides[W] = 'sure';                  // the AI stays confident (that's the problem)
  S.wrong = { id: W, other: P, believed: wS, realSlot: pS, reached: false, corrected: false, reveal: false };
  const ep = S.epoch, idx = rt.path.indexOf(wS), pts = rt.path.slice(0, idx + 1).map(center);
  if (instant || RM || pts.length < 2) { S.wrong.reached = true; S.walker = pts[pts.length - 1]; render(); return; }
  S.animating = true; render();
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], t0 = performance.now(), d = 900;
    await new Promise(res => { const f = now => { if (S.epoch !== ep) return res(); const k = Math.min(1, (now - t0) / d); S.walker = { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }; render(); k < 1 ? requestAnimationFrame(f) : res(); }; requestAnimationFrame(f); });
    if (S.epoch !== ep) return;
  }
  S.wrong.reached = true; S.animating = false; render();
}
async function actReport({ instant } = {}) {
  if (!S.wrong) await actWrong({ instant: true });
  const w = S.wrong; if (!w || w.corrected) return;
  const who = CONFIG.residents[S.resident].name, bn = BY[w.id].name;
  addLog(fill(CONFIG.log.report, { who, block: bn }));
  await flipMove(() => {
    S.belief[w.id] = S.real[w.id]; S.belief[w.other] = S.real[w.other];
    S.overrides[w.id] = 'unknown'; S.overrides[w.other] = 'think';
    w.corrected = true; w.reached = true; S.walker = null;
    addLog(fill(CONFIG.log.fix, { block: bn, lag: CONFIG.wrong.lagMinutes, other: BY[w.other].name }));
    addLog(fill(CONFIG.log.share, { n: CONFIG.wrong.peopleHelped }));
  }, { dur: 1400, stagger: 0, instant });
  render();
}
function wrongOff() {
  const w = S.wrong; if (!w) return;
  flipMove(() => {
    S.real[w.id] = w.believed; S.real[w.other] = w.realSlot; S.belief[w.id] = w.believed; S.belief[w.other] = w.realSlot;
    delete S.overrides[w.id]; delete S.overrides[w.other]; S.wrong = null; S.walker = null;
  }, { dur: 900, stagger: 0 });
}
async function actOffline() {
  ensureDay();
  if (S.time < CONFIG.time.lastKnown + 5) setTime(420);
  S.offline = true; S.notice = null;
  addLog(fill(CONFIG.log.offline, { t: CONFIG.offline.lastKnownLabel })); addLog(CONFIG.log.mesh);
  render();
}
async function actOnline({ instant } = {}) {
  if (!S.offline) await actOffline();
  const before = Object.fromEntries(BLOCKS.map(b => [b.id, level(b.id)]));
  S.offline = false;
  CONFIG.offline.changes.forEach(c => { S.overrides[c.block] = c.to; });
  const changed = BLOCKS.filter(b => level(b.id) !== before[b.id]).map(b => b.id);
  changed.forEach(id => CONFIG.offline.changes.some(c => c.block === id) && addLog(fill(CONFIG.log.offChange, { block: BY[id].name })));
  addLog(fill(CONFIG.log.online, { n: changed.length }));
  S.notice = { n: changed.length };
  if (!instant && !RM) { S.blink = new Set(changed); render(); const ep = S.epoch; await wait(1400); if (S.epoch !== ep) return; S.blink = new Set(); }
  render();
}
async function actShock() {
  ensureDay();
  if (S.shock) return;
  S.offline = false; S.notice = null; S.wrong = null; S.walker = null;   // clear earlier what-ifs so Arjun's view is clean
  const id = CONFIG.aftershock.block, name = BY[id].name, ep = S.epoch;
  S.resident = 'arjun';
  const prev = planFor('arjun', S.belief, aiCost).order;
  S.shock = { prev, done: false }; S.animating = true;
  setTime(CONFIG.time.aftershock - CONFIG.time.warnMinutes);
  addLog(fill(CONFIG.log.shockWarn, { block: name }));
  const total = CONFIG.time.warnMinutes * 60, ms = RM ? 0 : 5000, t0 = performance.now();
  await new Promise(res => {
    const f = now => {
      if (S.epoch !== ep) return res();
      const k = ms ? Math.min(1, (now - t0) / ms) : 1, left = Math.ceil(total * (1 - k));
      S.banner = { cls: 'warn', html: `⚠ Aftershock warning · ${esc(name)} moves in <span class="cd">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span>` };
      S.time = CONFIG.time.aftershock - CONFIG.time.warnMinutes + Math.floor(CONFIG.time.warnMinutes * k);
      render(); k < 1 ? requestAnimationFrame(f) : res();
    };
    requestAnimationFrame(f);
  });
  if (S.epoch !== ep) return;
  S.banner = null;
  const occ = occupancy(S.belief), lot = MOVABLE.find(s => occ[s].type === 'lot');
  await flipMove(() => { S.belief[id] = lot; S.real[id] = lot; S.overrides[id] = 'think'; S.time = CONFIG.time.aftershock; }, { dur: 2200, stagger: 0 });
  if (S.epoch !== ep) return;
  addLog(fill(CONFIG.log.shock, { block: name }));
  S.shock.done = true; addLog(CONFIG.log.resort); render();
  await wait(RM ? 0 : 2500); if (S.epoch !== ep) return;
  delete S.overrides[id]; S.time = CONFIG.time.aftershock + 1; addLog(fill(CONFIG.log.shockSure, { block: name }));
  S.animating = false; render();
}

const ACTIONS = {
  reset: () => resetWorld(), night: actNight, anchors: actAnchors, sync: actSync, kamala: actKamala,
  wrong: actWrong, report: actReport, offline: actOffline, online: actOnline, aftershock: actShock, end: () => {},
};

/* =====================================================================
   Speech (Kamala's "Read aloud")
   ===================================================================== */
function stopSpeech() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} if (S) S.speaking = false; }
function readAloud() {
  if (!('speechSynthesis' in window)) return;
  if (S.speaking) { stopSpeech(); render(); return; }
  const rt = currentRoute(); if (!rt) return;
  const kt = kamalaText(rt, S.phase === 'eve'), T = CONFIG.text.en;
  let text = kt.head + ' ';
  if (S.wrong && S.wrong.corrected) text += fill(T.sorry, { block: BY[S.wrong.id].name, lag: CONFIG.wrong.lagMinutes }) + ' ';
  if (rt.unknownIds.length) text += T.warn + ' ';
  text += kt.steps.join(' ');
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.88; u.lang = 'en-IN';
  u.onend = u.onerror = () => { S.speaking = false; render(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u); S.speaking = true; render();
}

/* =====================================================================
   Story mode
   ===================================================================== */
const story = { i: -1, playing: false, timer: null, until: 0, remaining: 0 };
async function storyGo(i) {
  const steps = CONFIG.story;
  i = Math.max(0, Math.min(steps.length - 1, i));
  clearTimeout(story.timer); story.i = i;
  resetWorld(); S.resident = 'kamala';
  for (let j = 0; j < i; j++) await ACTIONS[steps[j].do]({ instant: true });
  S.pulse = false; render();
  $('#caption').textContent = steps[i].caption;
  $('#stCount').textContent = `${i + 1} / ${steps.length}`;
  ACTIONS[steps[i].do]({ instant: false });
  if (story.playing) schedule(steps[i].ms);
}
function schedule(ms) { clearTimeout(story.timer); story.remaining = ms; story.until = performance.now() + ms; story.timer = setTimeout(() => { if (story.i < CONFIG.story.length - 1) storyGo(story.i + 1); else { story.playing = false; syncStoryBtn(); } }, ms); }
function syncStoryBtn() { $('#stPlay').textContent = story.playing ? 'Pause' : 'Play'; }
function storyOpen() { $('#storybar').hidden = false; document.body.classList.add('story-on'); story.playing = true; syncStoryBtn(); storyGo(0); }
function storyClose() { clearTimeout(story.timer); story.playing = false; story.i = -1; $('#storybar').hidden = true; document.body.classList.remove('story-on'); }
function storyPause() {
  if (story.i < 0) return;
  if (story.playing) { story.playing = false; clearTimeout(story.timer); story.remaining = Math.max(0, story.until - performance.now()); }
  else { story.playing = true; schedule(story.remaining || 1500); }
  syncStoryBtn();
}

/* =====================================================================
   Wiring
   ===================================================================== */
function manual() { if (story.playing) storyPause(); }
buildBoard();
S = freshState(CONFIG.seed);
render();

$('#btnNight').onclick = async () => { manual(); resetWorld(); await actNight(); await actSync(); };
$('#btnReset').onclick = () => { manual(); resetWorld(); };
$('#btnSeed').onclick = () => { manual(); resetWorld(1 + Math.floor(Math.random() * 9999)); };
$('#timeSlider').oninput = e => { manual(); setTime(+e.target.value); };
$('#btnWrong').onclick = () => { manual(); S.wrong ? wrongOff() : actWrong(); };
$('#btnOffline').onclick = () => { manual(); S.offline ? actOnline() : actOffline(); };
$('#btnShock').onclick = () => { manual(); actShock(); };
$('#btnStory').onclick = storyOpen;
$('#stBack').onclick = () => storyGo(story.i - 1);
$('#stNext').onclick = () => storyGo(story.i + 1);
$('#stPlay').onclick = storyPause;
$('#stClose').onclick = storyClose;
$('#residents').onclick = e => { const b = e.target.closest('[data-res]'); if (!b) return; stopSpeech(); S.resident = b.dataset.res; render(); };
$('#msg').onclick = e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'report') { manual(); actReport(); }
  else if (a === 'reveal') { S.wrong.reveal = !S.wrong.reveal; render(); }
  else if (a === 'read') readAloud();
  else if (a === 'lang-en' || a === 'lang-hi') { S.lang = a.slice(5); render(); }
};
</script>
